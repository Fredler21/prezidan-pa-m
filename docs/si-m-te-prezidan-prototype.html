<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; the map of Haiti is the scoreboard, the desk is where you sign. Single dark look by choice. */
:root{
  color-scheme:dark;
  --night:#090f22; --panel:#111936; --panel2:#18224a; --line:#2a3768;
  --ink:#eef1fb; --mute:#9ba7d1;
  --blue:#3b66ff; --red:#e8405a; --gold:#f6c445; --green:#36cc8c; --amber:#f0a13a;
  --sea:#0c1740; --land:#1d5148; --land-edge:#3d8a78;
  --paper:#f2e9d6; --paper-ink:#1c1a16;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px;
  background-image:radial-gradient(900px 420px at 50% -120px,#1a2a6c55,transparent)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.08}
h1{font-size:2.3rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.55rem;font-weight:800}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
.mute{color:var(--mute)}
.fine{font-size:.8rem;color:var(--mute);text-align:center}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}

.top{display:flex;align-items:center;gap:8px;padding-block:12px 4px}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;margin-right:auto;display:flex;align-items:center;gap:8px}
.flag{width:22px;height:15px;border-radius:3px;background:linear-gradient(#2447d6 50%,var(--red) 50%);flex:none}
.chip{font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.gold{color:var(--gold);border-color:#6b5a22}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:1.05rem}
.icon-btn:hover{background:var(--panel2)}

.primary{width:100%;padding:15px 18px;border-radius:16px;background:var(--blue);color:#fff;font-weight:700;font-size:1.05rem;
  box-shadow:0 6px 0 #1f3aa8;transition:transform .08s,box-shadow .08s,opacity .2s}
.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #1f3aa8}
.primary:disabled{opacity:.4;cursor:not-allowed}
.primary.red{background:var(--red);box-shadow:0 6px 0 #9c2238}
.primary.red:active{box-shadow:0 2px 0 #9c2238}
.second{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.second:hover{background:var(--panel2)}
.ghost{padding:8px 10px;border-radius:10px;color:var(--mute);font-weight:600;font-size:.9rem}
.ghost:hover{color:var(--ink);background:var(--panel)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.screen{display:flex;flex-direction:column;gap:14px;animation:in .35s ease both}
@keyframes in{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* meters */
.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.m{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 8px;display:flex;flex-direction:column;gap:5px;position:relative;min-width:0}
.m .r{display:flex;align-items:center;justify-content:space-between;gap:4px}
.m svg{width:15px;height:15px;fill:var(--c)}
.m b{font-variant-numeric:tabular-nums;font-size:.92rem}
.bar{height:5px;border-radius:9px;background:#0006;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.k-sek{--c:#74a9ff}.k-eko{--c:var(--gold)}.k-lek{--c:var(--green)}.k-kon{--c:#ff8196}.k-kes{--c:#c7b6ff}
.list{display:flex;flex-direction:column;gap:9px}
.lm{display:grid;grid-template-columns:20px 1fr 34px 44px;align-items:center;gap:8px;font-size:.9rem}
.lm svg{width:17px;height:17px;fill:var(--c)}
.lm .nm{display:flex;flex-direction:column;gap:4px;min-width:0}
.lm b{text-align:right;font-variant-numeric:tabular-nums}
.delta{font-weight:800;font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums;animation:pop .6s .5s both}
.delta.up{color:var(--green)}.delta.dn{color:var(--red)}
@keyframes pop{0%{opacity:0;transform:translateY(8px) scale(.6)}60%{transform:translateY(-3px) scale(1.2)}100%{opacity:1;transform:none}}

/* scene */
.scene{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#0b1330;line-height:0}
.scene svg{width:100%;height:auto;display:block}
.blink{animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(3px) rotate(-1.5deg)}}
.wave{animation:wave 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes wave{50%{transform:skewY(7deg) scaleX(.93)}}
.hop{animation:hop 1s ease-in-out infinite;transform-box:fill-box}
@keyframes hop{50%{transform:translateY(-5px)}}
.sway{animation:sway 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes sway{0%,100%{transform:rotate(10deg)}50%{transform:rotate(24deg)}}
.rain{animation:rain .5s linear infinite}
@keyframes rain{to{transform:translate(-14px,28px)}}
.spin{animation:spin 5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(-360deg)}}
.drop{animation:drop 2.2s ease-in infinite;transform-box:fill-box}
@keyframes drop{0%{transform:translateY(-26px);opacity:0}25%{opacity:1}70%,100%{transform:translateY(16px);opacity:0}}

/* adviser */
.adv{display:flex;gap:10px;align-items:flex-start}
.ava{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:var(--panel2)}
.ava svg{width:100%;height:100%;display:block}
.bub{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bub small{color:var(--mute);font-weight:700;font-size:.74rem;letter-spacing:.04em}
.q{font-family:var(--display);font-weight:700;font-size:1.18rem;line-height:1.2;text-wrap:balance}
.hintb{align-self:flex-start;font-size:.82rem;font-weight:700;color:var(--gold);padding:6px 10px;border-radius:99px;border:1px dashed #6b5a22}
.hint{font-size:.9rem;color:#ffe9a8;animation:in .3s both}

/* dossier cards */
.opts{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.opts::-webkit-scrollbar{display:none}
.opt{flex:0 0 80%;scroll-snap-align:center;text-align:left;background:linear-gradient(170deg,#1d2957,#141d42);border:2px solid var(--line);border-radius:18px;
  padding:16px;display:flex;flex-direction:column;gap:8px;min-height:150px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.opt:before{content:"";position:absolute;top:0;left:18px;width:64px;height:7px;border-radius:0 0 7px 7px;background:var(--line)}
.opt.sel{border-color:var(--gold);transform:translateY(-4px)}
.opt.sel:before{background:var(--gold)}
.opt.no{opacity:.5}
.opt b{font-family:var(--display);font-size:1.15rem;line-height:1.15}
.opt span{color:var(--mute);font-size:.92rem}
.cost{align-self:flex-start;font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:99px;background:#0005;border:1px solid var(--line);color:#c7b6ff !important;margin-top:6px}
.cost.free{color:var(--green) !important}
.stamp{position:absolute;right:14px;bottom:14px;font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:.08em;color:var(--red) !important;
  border:3px solid var(--red);border-radius:8px;padding:2px 10px;transform:rotate(-12deg) scale(3);opacity:0;pointer-events:none}
.opt.stamped .stamp{animation:slam .4s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes slam{to{transform:rotate(-12deg) scale(1);opacity:1}}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .2s}
.dots i.on{background:var(--ink);width:20px}
.pips{display:flex;gap:4px}
.pips i{width:22px;height:5px;border-radius:9px;background:var(--line)}
.pips i.on{background:var(--gold)}

/* newspaper */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:14px 16px 16px;transform:rotate(-1.2deg);box-shadow:0 14px 30px #0008;animation:paper .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes paper{from{transform:rotate(-14deg) scale(.5);opacity:0}}
.paper .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--paper-ink);padding-bottom:5px;margin-bottom:9px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.paper .mast b{font-family:var(--display);font-size:1rem;letter-spacing:0;text-transform:none}
.paper h2{font-size:1.45rem;color:var(--paper-ink)}
.paper p{font-size:.9rem;margin-top:6px;color:#4a453b}

/* map */
.mapbox{background:var(--sea);border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative}
.mapbox svg{width:100%;height:auto;display:block}
.land{fill:var(--land);stroke:var(--land-edge);stroke-width:1.5;stroke-linejoin:round}
.road{fill:none;stroke-width:2.4;stroke-linecap:round;transition:stroke 1s}
.road.blocked{stroke:var(--red);stroke-dasharray:3 5}
.road.risky{stroke:var(--amber);stroke-dasharray:7 4}
.road.open{stroke:#7ff0bb;stroke-dasharray:9 3;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.glow{fill:var(--gold);transition:opacity 1s,r 1s}
.town{fill:#fff}
.school{fill:var(--green);stroke:#062;stroke-width:.6;animation:pop .5s both}
.maplabel{font:600 9px var(--body);fill:#cfe0ff}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 12px;font-size:.74rem;color:var(--mute);border-top:1px solid var(--line);background:var(--panel)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.node{cursor:pointer}
.node circle.n{fill:var(--panel2);stroke:var(--line);stroke-width:2}
.node.done circle.n{fill:var(--green);stroke:#0b5}
.node.cur circle.n{fill:var(--blue);stroke:#fff}
.node.cur circle.pulse{fill:none;stroke:var(--gold);stroke-width:2;animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(.8);opacity:1}to{transform:scale(1.9);opacity:0}}
.node text.num{font:800 13px var(--display);fill:#fff;text-anchor:middle}
.node text.st{font:700 10px var(--body);fill:var(--gold);text-anchor:middle}
.node text.ct{font:700 9px var(--body);fill:#e6ecff;text-anchor:middle}
.trail{fill:none;stroke:#ffffff55;stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round}

/* stars, score, badges */
.stars{display:flex;gap:10px;justify-content:center;font-size:3rem;line-height:1}
.stars span{color:var(--line)}
.stars span.on{color:var(--gold);animation:starin .5s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 0 22px #f6c44588}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.big{font-family:var(--display);font-weight:800;font-size:4rem;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:1.2rem;color:var(--mute);font-weight:700}
.center{text-align:center;align-items:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.bd{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:3px;background:var(--panel2);font-size:.8rem;color:var(--mute)}
.bd b{color:var(--ink);font-size:.88rem}
.bd .e{font-size:1.4rem}
.bd.off{opacity:.42;filter:grayscale(1)}
.yr{display:flex;align-items:center;gap:10px;font-size:.92rem}
.yr .s{margin-left:auto;color:var(--gold);letter-spacing:2px}
.event{border:1px dashed var(--amber);background:#f0a13a14;border-radius:14px;padding:12px;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.event b{color:var(--amber)}

.toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:30;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.toast{background:#fff;color:#111;font-weight:700;font-size:.9rem;padding:10px 16px;border-radius:99px;box-shadow:0 10px 30px #000a;animation:toast 3s both}
@keyframes toast{0%{transform:translateY(30px);opacity:0}10%,85%{transform:none;opacity:1}100%{opacity:0}}
.sheet{position:fixed;inset:0;background:#040818d9;z-index:20;display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:in .25s both}
.sheet>.card{width:100%;max-width:460px;max-height:86%;overflow:auto}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:25;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
a{color:#9db6ff}
@media (max-width:360px){h1{font-size:1.9rem}.opt{flex-basis:86%}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>

/* ---------- sound + haptics ---------- */
let ac;
function tone(f,t,type,v,when){if(M.muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+(when||0);o.type=type||'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(v||.1,s);g.gain.exponentialRampToValueAtTime(.001,s+t);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+t+.02)}catch(e){}}
const sfx={
 tap(){tone(540,.06)},
 stamp(){tone(95,.22,'square',.16);tone(55,.32,'sine',.3)},
 up(){[523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.11,i*.09))},
 down(){[330,262,196].forEach((f,i)=>tone(f,.2,'sawtooth',.05,i*.11))},
 star(i){tone(700+i*180,.25,'triangle',.13)},
 win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.12,i*.11))},
 badge(){tone(988,.1,'sine',.12);tone(1319,.25,'sine',.12,.1)}
};

/* ---------- small ui helpers ---------- */
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),3100)}
function confetti(){const cs=['#3b66ff','#e8405a','#f6c445','#36cc8c','#fff'];for(let i=0;i<46;i++){const e=document.createElement('i');e.className='conf';
  e.style.left=Math.random()*100+'vw';e.style.background=cs[i%5];e.style.animationDuration=(1.4+Math.random()*1.6)+'s';e.style.animationDelay=Math.random()*.4+'s';
  document.body.appendChild(e);setTimeout(()=>e.remove(),3600)}}
function award(id){if(M.badges[id])return;M.badges[id]=1;const b=BADGES.find(x=>x[0]===id);setTimeout(()=>{toast(b[1]+' Nouvo badj: '+b[2]);sfx.badge()},900);save()}
function checkBadges(){const s=S.st;if(s.sek>=55)award('road');if(s.eko>=55)award('build');if(s.lek>=55)award('teach');if(s.kon>=70)award('people');if(S.flags.remit)award('remit')}
function countUp(root){$$('[data-to]',root).forEach(el=>{const to=+el.dataset.to;if(el.tagName==='I'){requestAnimationFrame(()=>requestAnimationFrame(()=>el.style.width=to+'%'));return}
  const from=+el.dataset.from;if(from===to){el.textContent=to;return}const t0=performance.now();(function step(t){const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(from+(to-from)*p);if(p<1)requestAnimationFrame(step)})(t0)})}

function meterList(st,prev){return '<div class="list">'+STATS.map(([k,n])=>{const p=prev?prev[k]:st[k],d=st[k]-p;

const K=118,X=l=>+((l+74.6)*K).toFixed(1),Y=l=>+((20.12-l)*K).toFixed(1),pts=a=>a.map(p=>X(p[0])+','+Y(p[1])).join(' ');
const COAST=[[-73.4,19.8],[-73.2,19.93],[-72.83,19.95],[-72.5,19.9],[-72.2,19.78],[-71.84,19.68],[-71.72,19.6],[-71.7,19.35],[-71.63,19.15],[-71.75,18.95],[-71.95,18.62],[-71.72,18.33],[-71.77,18.04],[-72.1,18.2],[-72.53,18.2],[-73,18.17],[-73.4,18.24],[-73.75,18.16],[-73.92,18.04],[-74.2,18.2],[-74.42,18.33],[-74.46,18.57],[-74.12,18.67],[-73.6,18.54],[-73.09,18.46],[-72.75,18.44],[-72.4,18.53],[-72.33,18.62],[-72.52,18.77],[-72.72,19.08],[-72.78,19.3],[-72.69,19.45],[-73.05,19.63],[-73.25,19.66]];
const C={pap:[-72.29,18.58,'Pòtoprens'],okp:[-72.2,19.72,'Okap'],gon:[-72.62,19.44,'Gonayiv'],hin:[-72.01,19.15,'Hinche'],oka:[-73.75,18.22,'Okay'],jer:[-74.12,18.62,'Jeremi'],jak:[-72.53,18.26,'Jakmèl'],pdp:[-72.83,19.9,'Pòdepè']};
const ROADS=[['pap',[-72.6,19.0],'gon','okp'],['pap','hin','okp'],['pap','jak'],['pap',[-72.75,18.42],[-73.09,18.42],'oka'],['oka',[-73.95,18.4],'jer'],['gon','pdp']];
const NODES=['pap','okp','hin','oka','gon'];
const cp=k=>typeof k==='string'?C[k]:k;
function mapSVG(st,level,storm){
 const rc=st.sek<35?'blocked':st.sek<55?'risky':'open';
 const schools=Math.min(8,Math.floor(st.lek/12)), keys=Object.keys(C);
 let h=`<svg viewBox="0 0 360 262" role="img" aria-label="Kat Ayiti"><polygon class="land" points="${pts(COAST)}"/><ellipse class="land" cx="${X(-73.05)}" cy="${Y(18.83)}" rx="32" ry="8" transform="rotate(20 ${X(-73.05)} ${Y(18.83)})"/>`;
 h+=ROADS.map(r=>`<polyline class="road ${rc}" points="${pts(r.map(cp))}"/>`).join('');
 keys.forEach((k,i)=>{const [lo,la,n]=C[k],x=X(lo),y=Y(la);
  h+=`<circle class="glow" cx="${x}" cy="${y}" r="${4+st.eko/7}" opacity="${(st.eko/260).toFixed(2)}"/><circle class="town" cx="${x}" cy="${y}" r="2.600"/>`;
  if(i<schools)h+=`<rect class="school" x="${x+5}" y="${y-10}" width="7" height="7" rx="1.500" style="animation-delay:${i*.08}s"/>`;
  if(!level)h+=`<text class="maplabel" x="${x+(k==='jer'||k==='oka'?-4:6)}" y="${y+12}" text-anchor="${k==='hin'||k==='okp'?'end':'start'}">${n}</text>`});
 if(storm)h+=`<g class="spin"><circle cx="${X(-73.9)}" cy="${Y(18.3)}" r="30" fill="none" stroke="#dfe6ff" stroke-width="5" stroke-dasharray="26 14" opacity=".75"/><circle cx="${X(-73.9)}" cy="${Y(18.3)}" r="14" fill="none" stroke="#dfe6ff" stroke-width="4" stroke-dasharray="12 8" opacity=".75"/></g>`;
 if(level){
  h+=`<polyline class="trail" points="${pts(NODES.map(k=>C[k]))}"/>`;
  NODES.forEach((k,i)=>{const x=X(C[k][0]),y=Y(C[k][1]),cls=i<S.year||S.done?'done':i===S.year?'cur':'lock',s=S.stars[i];
   h+=`<g class="node ${cls}" data-y="${i}" tabindex="0" role="button" aria-label="Ane ${i+1}: ${YEARS[i].n}">${cls==='cur'?`<circle class="pulse" cx="${x}" cy="${y}" r="17"/>`:''}<circle class="n" cx="${x}" cy="${y}" r="16"/>
    <text class="num" x="${x}" y="${y+4.500}">${cls==='lock'?'🔒':i+1}</text><text class="ct" x="${x}" y="${y+28}">${YEARS[i].n}</text>${s?`<text class="st" x="${x}" y="${y-20}">${'★'.repeat(s)}${'☆'.repeat(3-s)}</text>`:''}</g>`})}
 return h+'</svg>'}
const legend='<div class="legend"><span><i style="background:#7ff0bb"></i>Wout = sekirite</span><span><i style="background:var(--gold)"></i>Limyè = ekonomi</span><span><i style="background:var(--green)"></i>Kare = lekòl</span></div>';

}

 if(S.year>0){S.st.kes=clamp(S.st.kes+12+Math.round(S.st.eko/4));
  evs=EVENTS.filter(e=>e.y===S.year&&S.flags[e.f]);evs.forEach(e=>{for(const k in e.e)S.st[k]=clamp(S.st[k]+e.e[k])})}
 S.inYear=true;S.d=0;S.y0=sum(S.st);save();
 const bad=evs.some(e=>Object.values(e.e).some(v=>v<0));

  <button class="primary" id="st">Kòmanse Ane ${S.year+1}</button>`);
 if(evs.length){bad?(sfx.down(),vib([60,40,60]),app.firstChild.classList.add('shake')):sfx.up()}

function play(){

 const afford=D.o.map(o=>o.c<=kes),none=!afford.some(Boolean),cheap=Math.min(...D.o.map(o=>o.c));

  <div class="adv"><div class="ava">${avatar(D.a)}</div><div class="bub"><small>${ADV[D.a].n} · ${ADV[D.a].r}</small><p class="q">${D.q}</p>
   <button class="hintb" id="hb">💡 Mande konsèy</button><p class="hint" id="ht" hidden>« ${D.hint} »</p></div></div>

   <span class="cost ${o.c?'':'free'}">${o.c?'Koute '+o.c:'Gratis'}${ok[i]?(afford[i]?'':' · sou kredi'):' · kès la pa ase'}</span><b>${o.t}</b><span>${o.d}</span><span class="stamp">DESIDE</span></button>`).join('')}</div>
  <div class="dots" id="dots">${D.o.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>

 let sel=-1;const box=$('#opts'),sign=$('#sign'),cards=$$('.opt',box);
 box.addEventListener('scroll',()=>{const c=box.scrollLeft+box.clientWidth/2;let b=0,bd=1e9;cards.forEach((e,i)=>{const d=Math.abs(e.offsetLeft-box.offsetLeft+e.offsetWidth/2-c);if(d<bd){bd=d;b=i}});

 cards.forEach((c,i)=>c.addEventListener('click',()=>{if(sign.dataset.busy)return;if(!ok[i]){toast('Kès leta a pa gen ase lajan pou sa.');vib(40);return}
  sel=i;cards.forEach(x=>x.classList.toggle('sel',x===c));sign.disabled=false;sign.textContent='Siyen dekrè a';sfx.tap();vib(10);

  setTimeout(()=>{sfx.stamp();vib(80);app.firstChild.classList.add('shake')},260);setTimeout(()=>choose(sel,!afford[sel]),950)});

}

function choose(i,loan){
 const o=DEC[S.year][S.d].o[i],before={...S.st};
 S.st.kes=clamp(S.st.kes-o.c);for(const k in o.e)S.st[k]=clamp(S.st[k]+o.e[k]);if(loan)S.st.kon=clamp(S.st.kon-3);
 if(o.f)S.flags[o.f]=1;S.last={y:S.year,d:S.d,i,before,loan};S.d++;award('first');checkBadges();save();result();
}

function report(){

 const end=y===4;if(end){S.done=true;award('full');M.best=Math.max(M.best,score(S.st))}else S.year++;

function profile(){const s=S.st,top=[['sek','Prezidan Lòd','Ou te mete sekirite anvan tout bagay.'],['eko','Prezidan Batisè','Ou te mize sou travay ak ekonomi.'],['lek','Prezidan Pwofesè','Ou te envesti nan lekòl ak lasante.'],['kon','Prezidan Pèp la','Ou te koute pèp la epi kenbe pawòl ou.']].sort((a,b)=>s[b[0]]-s[a[0]])[0];return top}

function tutorial(){

  'Chak chwa koute lajan nan <b>Kès leta</b>. Gade 5 ba ki anlè yo: sekirite, ekonomi, lekòl ak lasante, konfyans, kès.',
  'Si w ezite, peze <b>Mande konsèy</b>. Lè w pare, touche yon dosye epi <b>siyen dekrè a</b>. Kat Ayiti a ap montre w rezilta a.'];
 let i=0;const d=sheet('');const draw=()=>{d.firstChild.innerHTML=`<div class="adv"><div class="ava">${avatar('tij')}</div><div class="bub"><small>Ti Jan · Kijan pou jwe (${i+1}/3)</small><p>${steps[i]}</p></div></div><button class="primary" id="tn">${i<2?'Kontinye':'Mwen pare'}</button>`;
  $('#tn',d).onclick=()=>{sfx.tap();if(++i>2)d.remove();else draw()}};draw()}
function badgeSheet(){sheet(`<div class="row"><h2 class="grow">Badj yo</h2><button class="icon-btn" data-x aria-label="Fèmen">✕</button></div>
  <p class="mute">Seri jwèt: ${M.streak} jou · Pi bon nòt: ${M.best||'–'}/100</p>
  <div class="badges">${BADGES.map(b=>`<div class="bd ${M.badges[b[0]]?'':'off'}"><span class="e">${b[1]}</span><b>${b[2]}</b><span>${b[3]}</span></div>`).join('')}</div>`)}

/* ---------- boot ---------- */
function start(data){
 const s=(data&&data.S)||store.get('smp_state'),m=store.get('smp_meta');
 if(s&&s.st&&s.stars)S=Object.assign(fresh(),s);if(m)M=Object.assign(M,m);
 const day=d=>d.toISOString().slice(0,10),today=day(new Date()),yest=day(new Date(Date.now()-864e5));
 if(M.last!==today){M.streak=M.last===yest?M.streak+1:1;M.last=today}
 if(M.streak>=3)award('streak');save();
 $('#streak').textContent='🔥 '+M.streak+' jou';
 const mb=$('#mbtn');const setM=()=>{mb.textContent=M.muted?'🔇':'🔊';mb.setAttribute('aria-pressed',M.muted)};setM();
 mb.onclick=()=>{M.muted=!M.muted;setM();save();sfx.tap()};
 $('#bbtn').onclick=()=>{sfx.tap();badgeSheet()};
 home();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({S}))}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
